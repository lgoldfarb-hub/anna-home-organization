      shortBoxText: "<strong>Em resumo:</strong> a informação que submete é utilizada apenas pela Anna Goldfarb para responder à sua mensagem e, caso avance, para prestar os serviços de organização de casas ou mudanças que solicitou. Nunca é vendida, alugada ou partilhada com terceiros para fins de marketing.",
      h2_1: "1. Quem é responsável pelos seus dados",
      body_1: "<p>A Anna Goldfarb, organizadora profissional de casas, a operar em Portugal e internacionalmente, é a responsável pelo tratamento dos dados pessoais recolhidos através deste Site. Pode contactar a Anna diretamente através dos dados de contacto indicados no Site.</p>",
      h2_2: "2. Que dados são recolhidos",
      body_2: "<p>Ao submeter o formulário de contacto, podem ser recolhidas as seguintes informações:</p><ul><li>Nome completo</li><li>Endereço de e-mail</li><li>Número de telefone / WhatsApp (opcional)</li><li>Localidade (cidade ou país)</li><li>Serviço do seu interesse</li><li>Quaisquer detalhes que decida partilhar sobre o seu projeto ou a sua casa</li></ul><p>Este Site não recolhe dados através de cookies ou scripts de monitorização, para além do estritamente necessário para processar o envio do formulário.</p>",
      h2_3: "3. Porque são recolhidos os seus dados (finalidade e base legal)",
      body_3: "<p>Os seus dados são utilizados exclusivamente para:</p><ul><li>responder à sua mensagem;</li><li>discutir, planear e prestar os serviços de organização de casas ou mudanças que solicita;</li><li>manter registos básicos de comunicação com o cliente durante o tempo razoavelmente necessário ao projeto.</li></ul><p>A base legal para este tratamento é o seu consentimento (dado ao assinalar a caixa de consentimento antes de submeter o formulário) e, assim que um projeto é iniciado, a execução do contrato de prestação de serviços entre si e a Anna.</p>",
      h2_4: "4. Sem partilha com terceiros",
      body_4: "<p>Os seus dados são utilizados exclusivamente pela Anna Goldfarb para prestar os serviços associados ao seu projeto. <strong>Nunca</strong> são vendidos, alugados, trocados ou partilhados com terceiros para fins publicitários ou de marketing.</p><p>Os seus dados só podem ser partilhados com prestadores de serviços de confiança, estritamente quando necessário para o funcionamento do Site e do formulário, nomeadamente:</p><ul><li><strong>FormSubmit</strong>, o serviço de terceiros que entrega os envios do formulário por e-mail; ou</li><li><strong>Netlify</strong>, o fornecedor de alojamento deste Site,</li></ul><p>ambos processam os dados apenas em nome da Anna e sob as suas próprias obrigações de privacidade e segurança, nunca para fins de marketing próprios. Nenhum outro terceiro recebe os seus dados, e estes nunca são transferidos para fins comerciais.</p>",
      h2_5: "5. Durante quanto tempo os seus dados são conservados",
      body_5: "<p>Os seus dados são conservados apenas durante o tempo necessário para responder à sua mensagem e, caso se torne cliente, durante a duração do projeto mais um período razoável depois, para efeitos de registo. Caso não avance nenhum projeto, os dados da sua mensagem são eliminados num prazo razoável, assim que for claro que não existe necessidade de os manter.</p>",
      h2_6: "6. Os seus direitos ao abrigo do RGPD",
      body_6: "<p>Tem o direito de:</p><ul><li>aceder aos dados pessoais que lhe dizem respeito;</li><li>corrigir dados inexatos ou incompletos;</li><li>solicitar a eliminação dos seus dados («direito ao esquecimento»);</li><li>restringir ou opor-se ao tratamento dos seus dados;</li><li>solicitar uma cópia dos seus dados num formato portátil;</li><li>retirar o seu consentimento a qualquer momento, sem afetar a licitude do tratamento realizado antes dessa retirada.</li></ul><p>Para exercer qualquer um destes direitos, basta contactar a Anna através dos dados de contacto indicados no Site. Tem também o direito de apresentar uma reclamação junto da sua autoridade de controlo de proteção de dados local.</p>",
      h2_7: "7. Segurança dos dados",
      body_7: "<p>São utilizadas medidas técnicas e organizativas razoáveis para proteger os seus dados contra acesso não autorizado, perda ou utilização indevida. No entanto, nenhum método de transmissão ou armazenamento eletrónico é 100% seguro, pelo que não é possível garantir uma segurança absoluta.</p>",
      h2_8: "8. Privacidade de menores",
      body_8: "<p>Este Site não se dirige a crianças, e não são recolhidos conscientemente dados pessoais de menores.</p>",
      h2_9: "9. Alterações a esta política",
      body_9: "<p>Esta Política de Privacidade pode ser atualizada periodicamente, por exemplo para refletir alterações no funcionamento do Site ou dos serviços. A data de «Última atualização» no topo desta página refletirá a revisão mais recente.</p>",
      h2_10: "10. Contacto",
      body_10: "<p>Se tiver alguma questão sobre esta Política de Privacidade ou sobre o tratamento dos seus dados, entre em contacto utilizando os dados indicados na secção <a href=\"index.html#contact\">Contacto</a> do Site.</p>",
      footerBackText: "Voltar à página inicial"
    }
  };

  var LANG_NAMES = { en: "EN", ru: "RU", fr: "FR", pt: "PT" };
  var LANGS = ["en", "ru", "fr", "pt"];

  function getStoredLang() {
    try {
      var v = localStorage.getItem("anna_lang");
      if (v && T[v]) return v;
    } catch (e) {}
    return null;
  }

  function setStoredLang(code) {
    try { localStorage.setItem("anna_lang", code); } catch (e) {}
  }

  function render(code) {
    var t = T[code] || T.en;
    document.documentElement.lang = code === "pt" ? "pt-PT" : code;
    document.getElementById("pp-title").textContent = t.title;
    document.getElementById("pp-desc").setAttribute("content", t.metaDescription);
    document.getElementById("pp-back-text").textContent = t.backLink;
    document.getElementById("pp-updated-label").textContent = t.lastUpdatedLabel;
    document.getElementById("pp-h1").textContent = t.h1;
    document.getElementById("pp-intro").textContent = t.introParagraph;
    document.getElementById("pp-short").innerHTML = t.shortBoxText;
    for (var i = 1; i <= 10; i++) {
      document.getElementById("pp-h2-" + i).textContent = t["h2_" + i];
      document.getElementById("pp-body-" + i).innerHTML = t["body_" + i];
    }
    document.getElementById("pp-footer-link").textContent = t.footerBackText;

    var sw = document.getElementById("pp-langsw");
    sw.innerHTML = "";
    LANGS.forEach(function (c) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = LANG_NAMES[c];
      btn.setAttribute("aria-pressed", c === code ? "true" : "false");
      btn.addEventListener("click", function () {
        setStoredLang(c);
        render(c);
      });
      sw.appendChild(btn);
    });
  }

  render(getStoredLang() || "en");
})();
</script>
</body>
</html>
