<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anna Goldfarb — Home Organization in Portugal &amp; worldwide</title>
<meta name="description" content="Less mess. Less mental load. More room for life. Thoughtful home organization and storage solutions in Portugal &amp; worldwide by Anna Goldfarb.">
<meta property="og:title" content="Anna. Home Organization">
<meta property="og:description" content="Less mess. Less mental load. More room for life. Thoughtful home organization and storage solutions in Portugal &amp; worldwide.">
<meta property="og:image" content="assets/images/hero-anna.jpg">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&amp;family=Inter:wght@400;500;600&amp;family=Mrs+Saint+Delafield&amp;display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app"></div>

<!-- Hidden static form so Netlify's build-time parser detects and registers this form.
     The real, visible form is rendered from the <template> below and submitted via JS
     fetch() to Netlify's form-handling endpoint — this one is never shown or submitted. -->
<form name="contact" data-netlify="true" netlify-honeypot="website" style="display:none">
  <input type="text" name="name">
  <input type="email" name="email">
  <input type="tel" name="phone">
  <input type="text" name="location">
  <select name="service"><option value="organization"></option><option value="moving"></option><option value="storage"></option><option value="unsure"></option></select>
  <textarea name="message"></textarea>
  <input type="text" name="website">
</form>

<!-- Page template. Edit copy in js/app.js (translations) and markup here. -->
<template id="page">
<div style="min-height: 100vh; background: #F8F6F2">

<!-- HEADER -->
<header class="hdr {{hdrCls}}">
  <div class="wrap">
    <div class="hdr-in">
      <a class="brand" href="#home" aria-label="Anna. Home Organization"><b>Anna.</b><small>Home Organization</small></a>
      <nav class="nav" aria-label="Main">
        <sc-for list="{{nav}}" as="n" hint-placeholder-count="4"><a href="{{n.href}}">{{n.label}}</a></sc-for>
      </nav>
      <div class="hdr-actions">
        <div class="lsw">
          <button type="button" class="lsw-btn" aria-haspopup="true" aria-expanded="{{langExp}}" aria-controls="lsw-menu" aria-label="Language: {{curName}}" onClick="{{toggleLang}}">{{curCode}}<svg class="i lsw-chev" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
          <sc-if value="{{langOpen}}" hint-placeholder-val="{{ false }}">
            <div class="lsw-menu" id="lsw-menu" role="group" aria-label="Language">
              <sc-for list="{{langs}}" as="l" hint-placeholder-count="4"><button type="button" class="lsw-item" aria-pressed="{{l.pressed}}" lang="{{l.lc}}" onClick="{{l.pick}}"><span class="lsw-code">{{l.code}}</span><span>{{l.name}}</span></button></sc-for>
            </div>
          </sc-if>
        </div>
        <button type="button" class="burger" aria-expanded="{{menuExp}}" aria-controls="mpanel" aria-label="Menu" onClick="{{toggleMenu}}">
          <sc-if value="{{menuClosed}}" hint-placeholder-val="{{ true }}"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></sc-if>
          <sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></sc-if>
        </button>
      </div>
    </div>
    <sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
      <div class="mpanel" id="mpanel">
        <nav aria-label="Mobile">
          <sc-for list="{{nav}}" as="n" hint-placeholder-count="4"><a href="{{n.href}}" onClick="{{closeMenu}}">{{n.label}}</a></sc-for>
        </nav>
      </div>
    </sc-if>
  </div>
</header>

<main>
<!-- HERO -->
<section class="hero" id="home">
<div class="wrap hero-grid">
  <div class="hero-text">
    <h1 class="hero-h1 {{heroH1Cls}} rise d1"><span class="ln">{{t.h1l1}}</span> <span class="ln">{{t.h1l2}}</span> <span class="ln"><em>{{t.h1b}}</em> {{t.h1c}}</span></h1>
    <p class="hero-sub rise d2">{{t.subA}}<strong>{{t.subB}}</strong>{{t.subC}}</p>
    <div class="ctas rise d3"><a class="btn btn-dark" href="#contact-form">{{t.cta}}<svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
      <button type="button" class="btn btn-ghost" onClick="{{openVideo}}"><span class="play-dot"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor"></path></svg></span>{{t.watch}}</button></div>
  </div>
  <div class="hero-photo"><div class="hero-img"><img src="assets/images/hero-anna.jpg" alt="Anna Goldfarb"></div>
  </div>
</div>
</section>

<!-- WHY -->
<section class="sec" id="why" style="padding-top: clamp(16px, 2vw, 32px)">
  <div class="wrap">
    <h2 class="h2 reveal" style="max-width: 820px">{{t.whyTitleA}} <sc-if value="{{whyTitleBr}}" hint-placeholder-val="{{ true }}"><br></sc-if>{{t.whyTitleB}}</h2>
    <div class="cards reveal">
      <div class="card">
        <div class="ic"><svg class="i" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="2"></rect><path d="M3.5 9.5h17M3.5 15h17M10 3.5v6M14 9.5V15"></path></svg></div>
        <p>{{t.why1a}}<strong>{{t.why1b}}</strong>{{t.why1c}}</p>
      </div>
      <div class="card">
        <div class="ic"><svg class="i" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg></div>
        <p>{{t.why2a}}<strong>{{t.why2b}}</strong>{{t.why2c}}</p>
      </div>
      <div class="card">
        <div class="ic"><svg class="i" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 8L12 3.5 20.5 8v8L12 20.5 3.5 16z"></path><path d="M3.5 8L12 12.5 20.5 8M12 12.5v8"></path></svg></div>
        <p>{{t.why3a}}<strong>{{t.why3b}}</strong>{{t.why3c}}</p>
      </div>
    </div>
  </div>
</section>

<!-- SERVICES -->
<section class="sec" id="services" style="padding-top: 0">
  <div class="wrap">
    <h2 class="h2 reveal" style="border-top: 1px solid #DCD5C9; padding-top: clamp(24px, 3vw, 40px)">{{t.svc}}</h2>
    <div class="svcblk reveal" style="margin-top: 56px">
      <div class="svchead">
        <span class="movsvc-l">
          <span class="zone-ic"><svg class="i" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 4h17v3.5h-17z M4.75 7.5h14.5V19a1 1 0 0 1-1 1H5.75a1 1 0 0 1-1-1z M9.5 11.5h5"></path></svg></span>
          <h3 class="h3">{{t.org}}</h3>
        </span>
        <span class="movsvc-r">
          <span class="price">{{t.price}}</span>
          <a class="arrow" href="#process" onClick="{{toOrg}}" aria-label="{{orgArrowLabel}}"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
        </span>
      </div>
      <div class="zones">
        <sc-for list="{{zones}}" as="z" hint-placeholder-count="9">
          <div class="zone">
            <span class="zone-ic"><svg class="i" width="21" height="21" viewBox="0 0 24 24" aria-hidden="true"><path d="{{z.d}}"></path></svg></span>
            <span class="zone-l">{{z.label}}</span>
          </div>
        </sc-for>
      </div>
      <p class="price-note">{{t.priceNote}}</p>
    </div>
    <a class="svcblk movsvc reveal" href="#process" onClick="{{toMoving}}">
      <span class="movsvc-l">
        <span class="zone-ic"><svg class="i" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 8L12 3.5 20.5 8v8L12 20.5 3.5 16z M3.5 8L12 12.5 20.5 8 M12 12.5v8"></path></svg></span>
        <span class="h3">{{t.mov}}</span>
      </span>
      <span class="movsvc-r">
        <span class="price">{{t.movPrice}}</span>
        <span class="arrow"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
      </span>
    </a>
    <div class="band reveal">
      <span class="band-ic"><svg class="i" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5L12 4l8.5 6.5V20h-17z"></path><path d="M9.5 20v-6h5v6"></path></svg></span>
      <p>{{t.extra}}</p>
    </div>
  </div>
</section>

<!-- HOW IT WORKS -->
<section class="sec" id="process" style="background: #EAE4DA">
  <div class="wrap">
    <div class="center reveal">
      <h2 class="h2">{{t.how}}</h2>
      <div class="tabs" role="tablist" aria-label="{{t.how}}">
        <button type="button" class="tab" role="tab" id="tab-org" aria-controls="panel-how" aria-selected="{{tabOrg.sel}}" onClick="{{tabOrg.pick}}">{{t.org}}</button>
        <button type="button" class="tab" role="tab" id="tab-mov" aria-controls="panel-how" aria-selected="{{tabMov.sel}}" onClick="{{tabMov.pick}}">{{t.mov}}</button>
      </div>
    </div>

    <sc-if value="{{isOrg}}" hint-placeholder-val="{{ true }}">
      <div class="panel" id="panel-how" role="tabpanel" aria-labelledby="tab-org">
        <ol class="tl">
          <li><span class="tl-n">1</span><div class="tl-b">{{t.o1}}</div></li>
          <li><span class="tl-n">2</span><div class="tl-b">{{t.o2}}
            <ul class="sub"><sc-for list="{{t.o2list}}" as="x" hint-placeholder-count="5"><li>{{x}}</li></sc-for></ul>
            <p class="subnote">{{t.o2note}}</p></div></li>
          <li><span class="tl-n">3</span><div class="tl-b">{{t.o3}}</div></li>
          <li><span class="tl-n">4</span><div class="tl-b">{{t.o4}}</div></li>
          <li><span class="tl-n">5</span><div class="tl-b">{{t.o5}}</div></li>
          <li><span class="tl-n">6</span><div class="tl-b">{{t.o6}}</div></li>
          <li><span class="tl-n">7</span><div class="tl-b">{{t.o7}}</div></li>
          <li><span class="tl-n">8</span><div class="tl-b">{{t.o8}}</div></li>
          <li class="voila"><span class="tl-n">9</span><div class="tl-b">{{t.o9}}</div></li>
        </ol>
      </div>
    </sc-if>
    <sc-if value="{{isMov}}" hint-placeholder-val="{{ false }}">
      <div class="panel" id="panel-how" role="tabpanel" aria-labelledby="tab-mov">
        <p class="intro">{{t.mIntro}}</p>
        <ol class="tl">
          <sc-for list="{{movSteps}}" as="m" hint-placeholder-count="5"><li><span class="tl-n">{{m.n}}</span><div class="tl-b">{{m.text}}<strong>{{m.bold}}</strong></div></li></sc-for>
        </ol>
      </div>
    </sc-if>
    <div class="ctas" style="max-width: 860px; margin: 48px auto 0; padding-left: 78px"><a class="btn btn-dark" href="#contact-form">{{t.howCta}}<svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a></div>
  </div>
</section>

<!-- BEFORE & AFTER -->
<section class="sec" id="results">
  <div class="wrap">
    <h2 class="h2 center reveal">{{ba.title}}</h2>
    <div class="ba-car reveal">
      <sc-if value="{{cur.single}}" hint-placeholder-val="{{ false }}">
        <figure class="ba-fig ba-single"><button type="button" class="ba-zoom" aria-label="{{ba.expand}}" onClick="{{cur.clickB}}"><img src="{{cur.b}}" alt="{{cur.alt}}"></button></figure>
      </sc-if>
      <sc-if value="{{cur.pair}}" hint-placeholder-val="{{ true }}">
      <div class="ba-pair">
        <figure class="ba-fig"><button type="button" class="ba-zoom" aria-label="{{ba.expand}}" onClick="{{cur.clickB}}"><img src="{{cur.b}}" alt="{{cur.bl}} — {{cur.label}}"></button><figcaption class="{{cur.bCls}}">{{cur.bl}}</figcaption></figure>
        <figure class="ba-fig"><button type="button" class="ba-zoom" aria-label="{{ba.expand}}" onClick="{{cur.clickA}}"><img src="{{cur.a}}" alt="{{cur.al}} — {{cur.label}}"></button><figcaption class="ba-lbl ba-lbl-a">{{cur.al}}</figcaption></figure>
      </div>
      </sc-if>
      <div class="ba-bar">
        <span class="ba-zone">{{cur.label}} <span class="ba-count">{{cur.n}} / {{baTotal}}</span></span>
        <div class="ba-dots">
          <sc-for list="{{baDots}}" as="d" hint-placeholder-count="5"><button type="button" class="ba-dot" aria-label="{{d.label}}" aria-pressed="{{d.on}}" onClick="{{d.go}}"></button></sc-for>
        </div>
        <div class="ba-nav">
          <button type="button" class="ba-arrow" aria-label="{{ba.prev}}" onClick="{{baPrev}}"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button>
          <button type="button" class="ba-arrow" aria-label="{{ba.next}}" onClick="{{baNext}}"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- TESTIMONIALS -->
<section class="sec" id="testimonials" style="background: #EAE4DA; padding-block: clamp(48px, 5vw, 72px)">
  <div class="wrap center reveal">
    <h2 class="h2">{{t.testi}}</h2>
    <sc-if value="{{igReady}}" hint-placeholder-val="{{ false }}">
      <p class="ig-btn-wrap"><a class="btn btn-dark ig-btn" href="{{igHref}}" target="_blank" rel="noopener"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="flex: none"><rect x="3.5" y="3.5" width="17" height="17" rx="5"></rect><circle cx="12" cy="12" r="3.8"></circle><circle cx="17.2" cy="6.8" r=".6"></circle></svg><span>{{t.igLine}}</span></a></p>
    </sc-if>
    <sc-if value="{{igPending}}" hint-placeholder-val="{{ true }}">
      <p class="ig-line">{{t.igLine}}</p>
    </sc-if>
  </div>
</section>

<!-- ABOUT -->
<section class="sec" id="about">
  <div class="wrap">
    <div class="about">
      <div class="arch reveal"><img src="assets/images/about-anna.jpg" alt="Anna Goldfarb"></div>
      <div class="reveal">
        <h2 class="h2">{{t.about}}</h2>
        <div class="paras">
          <sc-for list="{{t.aboutP}}" as="p" hint-placeholder-count="3"><p>{{p}}</p></sc-for>
        </div>
        <div class="ctas" style="margin-top: 36px"><a class="btn btn-dark" href="#contact-form">{{t.closing}}<svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"></path></svg></a></div>
        <p class="regards">{{t.regards}}</p>
        <p class="sig">Anna Goldfarb.</p>
      </div>
    </div>
  </div>
</section>
<!-- ============ CONTACT ============ -->
<section class="sec" id="contact" style="background: #EAE4DA">
  <div class="wrap">
    <div class="contact">
      <div class="reveal">
        <p class="eyebrow">{{t.contact}}</p>
        <h2 class="h2" style="margin-top: 22px">{{t.cTitle2}}</h2>
        <p class="lead" style="margin-top: 22px">{{t.cSub}}</p>
        <div class="opts">
          <sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
            <sc-if value="{{o.ready}}" hint-placeholder-val="{{ false }}">
              <a class="copt" href="{{o.href}}" target="{{o.target}}" rel="noopener">
                <span class="copt-ic">
                  <sc-if value="{{o.isWa}}" hint-placeholder-val="{{ false }}"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 0 1-12.4 7.6L3.5 20.5l1-4.4A8.5 8.5 0 1 1 20.5 12z"></path></svg></sc-if>
                  <sc-if value="{{o.isTg}}" hint-placeholder-val="{{ false }}"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.5 3.5L2.5 11l7 2.5 2.5 7 3.5-4.5 4.5 3.5z M9.5 13.5L21.5 3.5"></path></svg></sc-if>
                  <sc-if value="{{o.isIg}}" hint-placeholder-val="{{ false }}"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"></rect><circle cx="12" cy="12" r="3.8"></circle></svg></sc-if>
                  <sc-if value="{{o.isEm}}" hint-placeholder-val="{{ false }}"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3.5 7l8.5 6 8.5-6"></path></svg></sc-if>
                </span>
                <span style="display: flex; flex-direction: column"><span class="copt-t">{{o.t}}</span><span class="copt-d">{{o.d}}</span></span>
                <sc-if value="{{o.canCopy}}" hint-placeholder-val="{{ false }}">
                  <button type="button" class="copt-copy" title="{{o.copyTip}}" aria-label="{{o.copyTip}}" onClick="{{o.copyValue}}"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"></path></svg></button>
                </sc-if>
              </a>
            </sc-if>
            <sc-if value="{{o.pending}}" hint-placeholder-val="{{ true }}">
              <div class="copt" style="border: 1px dashed #A9A193">
                <span class="copt-ic">
                  <sc-if value="{{o.isWa}}" hint-placeholder-val="{{ false }}"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 0 1-12.4 7.6L3.5 20.5l1-4.4A8.5 8.5 0 1 1 20.5 12z"></path></svg></sc-if>
                  <sc-if value="{{o.isTg}}" hint-placeholder-val="{{ false }}"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.5 3.5L2.5 11l7 2.5 2.5 7 3.5-4.5 4.5 3.5z M9.5 13.5L21.5 3.5"></path></svg></sc-if>
                  <sc-if value="{{o.isIg}}" hint-placeholder-val="{{ false }}"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"></rect><circle cx="12" cy="12" r="3.8"></circle></svg></sc-if>
                  <sc-if value="{{o.isEm}}" hint-placeholder-val="{{ false }}"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3.5 7l8.5 6 8.5-6"></path></svg></sc-if>
                </span>
                <span style="display: flex; flex-direction: column"><span class="copt-t">{{o.t}}</span><span class="copt-d">{{o.ph}}</span></span>
              </div>
            </sc-if>
          </sc-for>
        </div>
      </div>

      <form class="form reveal" id="contact-form" onSubmit="{{submit}}" novalidate="novalidate" aria-label="{{t.cTitle2}}">
        <sc-if value="{{stInvalid}}" hint-placeholder-val="{{ false }}"><div class="note note-err" role="alert">{{errText}}</div></sc-if>
        <div class="fgrid">
          <div class="field">
            <label for="f-name">{{t.lName}} <span class="req" title="{{reqTip}}" aria-hidden="true">*</span></label>
            <input class="inp" id="f-name" aria-required="true" name="name" type="text" autocomplete="name" value="{{form.name}}" aria-invalid="{{inv.name}}" aria-describedby="e-name" onChange="{{on.name}}">
            <sc-if value="{{err.name}}" hint-placeholder-val="{{ false }}"><span class="ferr" id="e-name">{{err.name}}</span></sc-if>
          </div>
          <div class="field">
            <label for="f-email">{{t.lEmail}} <span class="req" title="{{reqTip}}" aria-hidden="true">*</span></label>
            <input class="inp" id="f-email" aria-required="true" name="email" type="email" autocomplete="email" value="{{form.email}}" aria-invalid="{{inv.email}}" aria-describedby="e-email" onChange="{{on.email}}">
            <sc-if value="{{err.email}}" hint-placeholder-val="{{ false }}"><span class="ferr" id="e-email">{{err.email}}</span></sc-if>
          </div>
          <div class="field pair">
            <label for="f-phone">{{t.lPhone}}</label>
            <input class="inp" id="f-phone" name="phone" type="tel" autocomplete="tel" value="{{form.phone}}" onChange="{{on.phone}}">
          </div>
          <div class="field pair">
            <label for="f-loc">{{t.lLoc}} <span class="req" title="{{reqTip}}" aria-hidden="true">*</span></label>
            <input class="inp" id="f-loc" aria-required="true" name="location" type="text" autocomplete="address-level2" value="{{form.loc}}" aria-invalid="{{inv.loc}}" aria-describedby="e-loc" onChange="{{on.loc}}">
            <sc-if value="{{err.loc}}" hint-placeholder-val="{{ false }}"><span class="ferr" id="e-loc">{{err.loc}}</span></sc-if>
          </div>
          <div class="field full">
            <label for="f-service">{{t.lService}}</label>
            <select class="inp" id="f-service" name="service" value="{{form.service}}" aria-invalid="{{inv.service}}" aria-describedby="e-service" onChange="{{on.service}}">
              <option value="">{{t.lChoose}}</option>
              <option value="{{svcOpts.0.v}}">{{svcOpts.0.label}}</option><option value="{{svcOpts.1.v}}">{{svcOpts.1.label}}</option><option value="{{svcOpts.2.v}}">{{svcOpts.2.label}}</option><option value="{{svcOpts.3.v}}">{{svcOpts.3.label}}</option>
            </select>
            <sc-if value="{{err.service}}" hint-placeholder-val="{{ false }}"><span class="ferr" id="e-service">{{err.service}}</span></sc-if>
          </div>
          <div class="field full">
            <label for="f-msg">{{t.lMsg}}</label>
            <textarea class="inp" id="f-msg" name="message" value="{{form.msg}}" aria-invalid="{{inv.msg}}" aria-describedby="e-msg" onChange="{{on.msg}}"></textarea>
            <sc-if value="{{err.msg}}" hint-placeholder-val="{{ false }}"><span class="ferr" id="e-msg">{{err.msg}}</span></sc-if>
          </div>
          <div class="hp" aria-hidden="true">
            <label for="f-web">Website</label>
            <input id="f-web" name="website" type="text" tabindex="-1" autocomplete="off" value="{{form.hp}}" onChange="{{on.hp}}">
          </div>
        </div>
        <div>
          <div class="consent">
            <input id="f-consent" type="checkbox" checked="{{form.consent}}" aria-invalid="{{inv.consent}}" aria-describedby="e-consent" onChange="{{on.consent}}">
            <label for="f-consent">{{t.consentA}} <a href="privacy.html" target="_blank" rel="noopener">{{t.consentLink}}</a>{{t.consentB}}</label>
          </div>
          <sc-if value="{{err.consent}}" hint-placeholder-val="{{ false }}"><p class="ferr" id="e-consent" style="margin-top: 8px; padding-left: 34px">{{err.consent}}</p></sc-if>
        </div>
        <sc-if value="{{stOk}}" hint-placeholder-val="{{ false }}"><div class="note note-ok" role="status">{{okText}}</div></sc-if>
        <sc-if value="{{stFallback}}" hint-placeholder-val="{{ false }}"><div class="note note-err" role="alert">{{fbText}} <a href="{{mailtoHref}}" target="_blank" rel="noopener" style="color: #7E2F22; font-weight: 600">{{fbLink}}</a></div></sc-if>
        <div><button type="button" class="btn btn-dark" onClick="{{submit}}" disabled="{{isSending}}" style="opacity: {{btnOpacity}}">{{t.submit}}<svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button></div>
      </form>
    </div>
  </div>
</section>
</main>

<!-- FOOTER -->
<footer class="foot">
  <div class="wrap foot-in">
    <nav aria-label="Footer">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="4"><a href="{{n.href}}">{{n.label}}</a></sc-for>
    </nav>
    <div class="langs" role="group" aria-label="Language">
      <sc-for list="{{langs}}" as="l" hint-placeholder-count="4"><button type="button" class="lang" aria-pressed="{{l.pressed}}" lang="{{l.lc}}" onClick="{{l.pick}}">{{l.code}}</button></sc-for>
    </div>
  </div>
  <div class="wrap"><p class="privacy"><a href="privacy.html" target="_blank" rel="noopener">{{t.privacy}}</a></p></div>
</footer>

<sc-if value="{{videoOpen}}" hint-placeholder-val="{{ false }}">
  <div class="vmodal" role="dialog" aria-modal="true" aria-label="{{t.watch}}">
    <button type="button" class="vmodal-bg" aria-label="{{closeLbl}}" onClick="{{closeVideo}}"></button>
    <div class="vmodal-box">
      <video src="assets/video/intro.mp4" poster="assets/video/intro-poster.jpg" controls="controls" autoplay="autoplay" playsinline="playsinline" preload="auto"></video>
      <button type="button" class="vmodal-x" aria-label="{{closeLbl}}" onClick="{{closeVideo}}"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
  </div>
</sc-if>

<sc-if value="{{photoOpen}}" hint-placeholder-val="{{ false }}">
  <div class="pmodal" role="dialog" aria-modal="true" aria-label="{{ba.title}}">
    <button type="button" class="vmodal-bg" aria-label="{{closeLbl}}" onClick="{{closePhoto}}"></button>
    <div class="pmodal-box">
      <img src="{{photoOpen}}" alt="">
      <button type="button" class="vmodal-x" aria-label="{{closeLbl}}" onClick="{{closePhoto}}"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
  </div>
</sc-if>

<sc-if value="{{waReady}}" hint-placeholder-val="{{ false }}">
  <a class="wa-float" href="{{waHref}}" target="_blank" rel="noopener" aria-label="WhatsApp"><svg class="i" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 0 1-12.4 7.6L3.5 20.5l1-4.4A8.5 8.5 0 1 1 20.5 12z"></path></svg></a>
</sc-if>
</div>
</template>

<noscript><p style="padding:24px;font-family:sans-serif">Please enable JavaScript to view this site.</p></noscript>
<script src="js/dc-lite.js"></script>
<script src="js/app.js"></script>
<script>
  mountDC(Component, document.getElementById("app"), document.getElementById("page"), { startLang: "en" });
</script>
</body>
</html>
